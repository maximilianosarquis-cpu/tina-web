<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Quiropraxia y Estética TINA</title>
<meta name="description" content="Centro de Quiropraxia y Estética TINA — quiropraxia, depilacion laser, faciales y podologia en Flores (CABA) y Mar del Tuyu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --magenta:#C4157E;
  --magenta-deep:#8F0F5C;
  --ciruela:#5C2A56;
  --dorado:#B8935A;
  --blush:#FBE7ED;
  --crema:#FBF6F0;
  --tinta:#2B1B2E;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;background:var(--crema);color:var(--tinta);line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}
a{color:inherit;}
img{display:block;max-width:100%;}
a:focus-visible, button:focus-visible{outline:2.5px solid var(--magenta-deep);outline-offset:3px;}

.nav{position:sticky;top:0;z-index:50;background:rgba(251,246,240,0.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(196,21,126,0.15);display:flex;align-items:center;gap:14px;padding:10px 18px;}
.nav-brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:1rem;color:var(--ciruela);white-space:nowrap;}
.nav-brand img{height:30px;width:30px;border-radius:50%;object-fit:cover;}
.nav-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.nav-scroll::-webkit-scrollbar{display:none;}
.nav-pill{flex:none;font-size:0.76rem;font-weight:600;padding:7px 14px;border-radius:999px;background:rgba(92,42,86,0.08);color:var(--ciruela);text-decoration:none;white-space:nowrap;transition:background .2s ease;}
.nav-pill:hover{background:rgba(92,42,86,0.18);}
.nav-pill.otra-sede{background:rgba(184,147,90,0.22);color:#7A5B26;font-weight:700;}

.hero{position:relative;padding:52px 22px 40px;text-align:center;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0%, var(--blush), transparent 70%);z-index:-1;}
.hero img.logo-hero{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;box-shadow:0 10px 26px rgba(43,27,46,0.18);}
.brand-name{font-size:0.76rem;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--ciruela);opacity:0.85;margin-bottom:10px;}
.sede-badge{display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:rgba(184,147,90,0.2);color:#7A5B26;padding:5px 14px;border-radius:999px;margin-bottom:14px;}
.hero h1{font-size:clamp(1.9rem,7vw,2.9rem);font-style:italic;font-weight:400;color:var(--ciruela);max-width:17ch;margin:0 auto 12px;}
.hero p{max-width:42ch;margin:0 auto;opacity:0.85;font-size:1rem;}

.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;margin:30px auto 0;padding:0 22px;}
@media (max-width:560px){.paths{grid-template-columns:1fr;}}
.path-card{display:block;text-decoration:none;color:inherit;border-radius:var(--radius);padding:20px 18px;border:1px solid rgba(0,0,0,0.06);transition:transform .25s ease, box-shadow .25s ease;}
.path-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,27,46,0.12);}
.path-card.a{background:linear-gradient(160deg,#f2e4ef,#fbf7fa);}
.path-card.b{background:linear-gradient(160deg,#fbe7ed,#fef9fa);}
.path-eyebrow{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.path-card.a .path-eyebrow{color:var(--ciruela);}
.path-card.b .path-eyebrow{color:var(--magenta-deep);}
.path-card h3{font-size:1.15rem;margin:6px 0 8px;}
.path-card p{font-size:0.85rem;opacity:0.75;margin:0;}

section.trat{max-width:720px;margin:0 auto;padding:50px 22px;border-top:1px solid rgba(0,0,0,0.06);scroll-margin-top:60px;}
section.trat:target{background:rgba(92,42,86,0.05);}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:14px;}
.eyebrow.ciruela{background:rgba(92,42,86,0.12);color:var(--ciruela);}
.eyebrow.magenta{background:rgba(196,21,126,0.12);color:var(--magenta-deep);}
.eyebrow.dorado{background:rgba(184,147,90,0.22);color:#7A5B26;}
.trat h2{font-size:clamp(1.35rem,4.5vw,1.85rem);margin-bottom:16px;}
.trat p.desc{opacity:0.85;margin-bottom:14px;}
.nota-link{font-size:0.88rem;margin-top:12px;opacity:0.85;}
.nota-link a{color:var(--magenta-deep);font-weight:700;text-decoration:none;}

.flyer-img{width:100%;border-radius:var(--radius);box-shadow:0 14px 32px rgba(43,27,46,0.16);}

.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;}
.btn-wsp{display:inline-flex;align-items:center;gap:8px;background:var(--magenta);color:#fff;font-weight:700;font-size:0.88rem;padding:12px 20px;border-radius:999px;text-decoration:none;box-shadow:0 8px 18px rgba(196,21,126,0.28);}
.btn-copiar{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid rgba(0,0,0,0.12);color:var(--tinta);font-family:inherit;font-size:0.8rem;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer;}
.btn-copiar:hover{border-color:var(--ciruela);}

.turnos-box{max-width:720px;margin:0 auto;padding:50px 22px;text-align:center;border-top:1px solid rgba(0,0,0,0.06);scroll-margin-top:60px;}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0;text-align:left;}
@media (max-width:640px){.pasos{grid-template-columns:1fr;}}
.paso{background:rgba(92,42,86,0.06);border-radius:16px;padding:16px 18px;}
.paso b{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ciruela);display:block;margin-bottom:4px;}

.llegar{max-width:720px;margin:0 auto;padding:50px 22px;border-top:1px solid rgba(0,0,0,0.06);scroll-margin-top:60px;}
.sede-card{border-radius:var(--radius);padding:22px;background:linear-gradient(160deg,#fbf7fa,#f7f0f5);border:1px solid rgba(0,0,0,0.06);margin-top:18px;}
.sede-card h3{font-size:1.1rem;margin-bottom:8px;}
.sede-card p{font-size:0.9rem;opacity:0.85;margin-bottom:14px;}
.sede-card a.mapa{font-size:0.85rem;font-weight:700;color:var(--magenta-deep);text-decoration:none;}

footer{text-align:center;padding:36px 22px 48px;opacity:0.75;font-size:0.82rem;}
footer a{font-weight:700;color:var(--ciruela);text-decoration:none;}
footer img{width:26px;height:26px;margin:0 auto 10px;border-radius:50%;opacity:0.8;}

.chooser-wrap{max-width:560px;margin:0 auto;padding:70px 22px;text-align:center;}
.chooser-wrap img{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;box-shadow:0 10px 26px rgba(43,27,46,0.18);}
.chooser-wrap h1{font-size:clamp(2rem,7vw,2.8rem);font-style:italic;font-weight:400;color:var(--ciruela);margin-bottom:10px;}
.chooser-wrap>p{opacity:0.8;margin-bottom:32px;}
.sede-cards{display:grid;gap:16px;}
.sede-choice{display:block;text-decoration:none;color:inherit;border-radius:var(--radius);padding:26px 22px;border:1px solid rgba(0,0,0,0.08);background:linear-gradient(160deg,#fbf7fa,#f7f0f5);transition:transform .25s ease, box-shadow .25s ease;text-align:left;}
.sede-choice:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(43,27,46,0.14);}
.sede-choice h3{font-size:1.3rem;margin-bottom:6px;color:var(--ciruela);}
.sede-choice span{font-size:0.85rem;opacity:0.75;}
</style>
</head>
